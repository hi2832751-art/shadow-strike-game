name: Build Offline Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Android WebView wrapper project and build APK
        run: |
          set -euo pipefail

          if [ ! -f index.html ]; then
            echo "Error: index.html not found in repository root."
            exit 1
          fi

          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null 2>&1 || true

          rm -rf android-app
          mkdir -p android-app/app/src/main/java/com/shadowstrike/game
          mkdir -p android-app/app/src/main/res/layout
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/assets

          cp index.html android-app/app/src/main/assets/index.html

          cat << 'EOF' > android-app/settings.gradle
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "ShadowStrike"
          include(":app")
          EOF

          cat << 'EOF' > android-app/build.gradle
          plugins {
            id "com.android.application" version "8.2.2" apply false
          }
          EOF

          cat << 'EOF' > android-app/app/build.gradle
          plugins {
            id "com.android.application"
          }

          android {
            namespace "com.shadowstrike.game"
            compileSdk 34

            defaultConfig {
              applicationId "com.shadowstrike.game"
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }

            buildTypes {
              release {
                minifyEnabled false
              }
              debug {
                minifyEnabled false
              }
            }

            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF

          cat << 'EOF' > android-app/app/src/main/res/values/strings.xml
          <resources>
            <string name="app_name">Shadow Strike</string>
          </resources>
          EOF

          cat << 'EOF' > android-app/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#080b10">

            <WebView
                android:id="@+id/gameWebView"
                android:layout_width="match_parent"
                android:layout_height="match_parent" />

          </FrameLayout>
          EOF

          cat << 'EOF' > android-app/app/src/main/java/com/shadowstrike/game/MainActivity.java
          package com.shadowstrike.game;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            private WebView webView;

            @SuppressLint("SetJavaScriptEnabled")
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              requestWindowFeature(Window.FEATURE_NO_TITLE);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              setContentView(R.layout.activity_main);

              webView = findViewById(R.id.gameWebView);
              webView.setBackgroundColor(Color.parseColor("#080b10"));
              webView.setOverScrollMode(View.OVER_SCROLL_NEVER);

              WebSettings settings = webView.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              settings.setDatabaseEnabled(true);
              settings.setMediaPlaybackRequiresUserGesture(false);
              settings.setAllowFileAccess(true);
              settings.setAllowContentAccess(true);
              settings.setUseWideViewPort(true);
              settings.setLoadWithOverviewMode(true);
              settings.setBuiltInZoomControls(false);
              settings.setDisplayZoomControls(false);
              settings.setSupportZoom(false);
              settings.setCacheMode(WebSettings.LOAD_NO_CACHE);

              webView.setWebViewClient(new WebViewClient());
              webView.loadUrl("file:///android_asset/index.html");
            }

            @Override
            public void onBackPressed() {
              if (webView != null && webView.canGoBack()) {
                webView.goBack();
              } else {
                super.onBackPressed();
              }
            }
          }
          EOF

          cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <application
                android:allowBackup="true"
                android:label="@string/app_name"
                android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">

              <activity
                  android:name=".MainActivity"
                  android:exported="true"
                  android:configChanges="orientation|screenSize|keyboardHidden"
                  android:screenOrientation="portrait">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>

            </application>
          </manifest>
          EOF

          cd android-app
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-Strike-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
